services:
  - type: web
    name: divya-trades-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URL
        sync: false
      - key: FRONTEND_URL
        value: https://divya-trades-frontend.onrender.com
      - key: DASHBOARD_URL
        value: https://divya-trades-frontend.onrender.com

  - type: static
    name: divya-trades-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /dashboard/*
        destination: /dashboard/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: REACT_APP_API_URL
        value: https://divyatrades.onrender.com
